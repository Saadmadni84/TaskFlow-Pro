server:
  port: 0

spring:
  application:
    name: taskflow-pro-test
  datasource:
    url: jdbc:h2:mem:taskflow_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.taskflow.taskflow: INFO

ai:
  enabled: false
  provider: noop
  model: test-model
  api-key: ""
  timeout-seconds: 5
  max-suggestions: 10
  rate-limit:
    requests-per-minute: 1000
