server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: taskflow-pro
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:taskflow}
    username: ${POSTGRES_USER:taskflow}
    password: ${POSTGRES_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.taskflow.taskflow: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:gemini}
  model: ${AI_MODEL:gemini-1.5-flash}
  api-key: ${AI_API_KEY:}
  timeout-seconds: ${AI_TIMEOUT:10}
  max-suggestions: ${AI_MAX_SUGGESTIONS:10}

